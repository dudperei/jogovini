<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c9ecff">
<title>Quebra-cabeça dos Bichinhos</title>
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
    font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif}
  body{background:linear-gradient(#c9ecff 0%,#e8f7ff 55%,#fff3d6 100%)}
  .cloud{position:fixed;background:#fff;border-radius:50px;opacity:.8;z-index:0;animation:drift 40s linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:140%;left:12%;top:-60%}
  .cloud::after{width:40%;height:110%;left:50%;top:-40%}
  .c1{width:120px;height:36px;top:12%;left:-150px}
  .c2{width:90px;height:28px;top:30%;left:-150px;animation-duration:55s;animation-delay:-20s}
  .c3{width:140px;height:40px;top:62%;left:-150px;animation-duration:70s;animation-delay:-45s}
  @keyframes drift{to{transform:translateX(calc(100vw + 300px))}}

  #play{position:fixed;inset:0;z-index:1}
  .board{position:absolute;background:rgba(255,255,255,.8);border-radius:24px;overflow:hidden;
    box-shadow:0 10px 30px rgba(60,90,140,.25)}
  .ghost{position:absolute;inset:0;width:100%;height:100%}
  .gart{opacity:.22;transition:opacity .6s}
  .board.done .gart{opacity:1}
  .board.bounce{animation:bounce .9s ease 2}
  .slot{fill:none;stroke:rgba(90,90,120,.45);stroke-width:2.6;stroke-dasharray:7 6;stroke-linejoin:round}
  .board.done .slot{display:none}
  .slot.pulse{stroke:#ff3d86;stroke-width:4.5;animation:blink .8s ease-in-out infinite}
  .piece{position:absolute;pointer-events:none;touch-action:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.28));
    transition:left .4s cubic-bezier(.3,1.4,.5,1),top .4s cubic-bezier(.3,1.4,.5,1),transform .3s}
  .piece svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
  .piece .outline{fill:none;stroke:#fff;stroke-width:2.6;stroke-linejoin:round;pointer-events:all}
  .piece.drag{transition:none;filter:drop-shadow(0 14px 14px rgba(0,0,0,.3))}
  .piece.placed{filter:none}
  .piece.placed .outline{pointer-events:none;stroke:rgba(255,255,255,.75)}
  .piece.done .outline{stroke:transparent}
  .piece.hint{animation:wiggle .5s ease-in-out infinite}
  @keyframes blink{50%{opacity:.3}}

  @keyframes wiggle{0%,100%{rotate:0deg}25%{rotate:-5deg}75%{rotate:5deg}}
  @keyframes pulse{50%{background:rgba(255,143,177,.3)}}
  @keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.07)}70%{transform:scale(.97)}}
  @keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
  @keyframes beat{50%{transform:scale(1.08)}}

  .confetti{position:fixed;top:0;z-index:30;pointer-events:none;animation:fall linear forwards}

  #stars{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top));z-index:20;
    background:rgba(255,255,255,.7);border-radius:30px;padding:6px 16px;font-size:24px;font-weight:700;color:#e0a000}

  #exitBtn{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;width:46px;height:46px;border-radius:50%;
    background:rgba(255,255,255,.55);color:#888;font-size:22px;display:grid;place-items:center;z-index:50;
    touch-action:none;opacity:.4;transition:transform .35s,opacity .2s}
  #exitBtn.drag{opacity:1;transition:none;background:#ffd0d0}
  #exitTarget{position:fixed;left:14px;bottom:14px;width:100px;height:100px;border-radius:50%;
    border:4px dashed #ff6b6b;display:none;place-items:center;z-index:49;font-size:34px;background:rgba(255,255,255,.75)}
  #exitTarget.show{display:grid}
  #exitTarget.hot{background:#ffb4b4;animation:beat .5s infinite}

  .overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;background:linear-gradient(#c9ecff,#fff3d6);text-align:center;padding:24px}
  .overlay.hidden{display:none}
  .overlay h1{margin:0;font-size:clamp(26px,6vw,46px);color:#3b5a8a}
  .overlay p{margin:0;font-size:clamp(16px,3.5vw,22px);color:#5b6b85;max-width:420px}
  .faces{font-size:clamp(48px,14vw,90px);display:flex;gap:10px}
  .faces span{animation:hop 1s ease-in-out infinite}
  .faces span:nth-child(2){animation-delay:.15s}.faces span:nth-child(3){animation-delay:.3s}
  .faces span:nth-child(4){animation-delay:.45s}
  .bigbtn{border:0;border-radius:60px;padding:18px 48px;font:inherit;font-size:clamp(28px,7vw,48px);font-weight:700;color:#fff;
    background:linear-gradient(#ff9ec0,#ff6f9f);box-shadow:0 10px 0 #d6507d,0 18px 30px rgba(0,0,0,.2);animation:beat 1.4s infinite;cursor:pointer}
  .bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #d6507d}
  .sbtn{border:0;border-radius:14px;padding:12px 22px;font:inherit;font-size:18px;font-weight:700;background:#fff;color:#3b5a8a;
    box-shadow:0 4px 12px rgba(0,0,0,.15);cursor:pointer}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>

<div id="play"></div>
<div id="stars">⭐ 0</div>
<div id="exitBtn" aria-label="Sair (arraste)">✕</div>
<div id="exitTarget">🔒</div>

<div id="start" class="overlay">
  <div class="faces"><span>🐱</span><span>🐰</span><span>🦆</span><span>🐻</span></div>
  <h1 id="startMsg">Vamos brincar?</h1>
  <button class="bigbtn" id="playBtn">▶ Brincar!</button>
</div>

<div id="parent" class="overlay hidden">
  <h1 id="parentTitle">Área dos pais 🔓</h1>
  <p id="parentMsg">Escolha o que fazer:</p>
  <div class="row">
    <button class="sbtn" id="resumeBtn">▶ Voltar a brincar</button>
    <button class="sbtn" id="quitBtn">Desligar a trava</button>
  </div>
</div>

/* ---------- Estado ---------- */
const $=s=>document.querySelector(s);
const play=$('#play'), startEl=$('#start'), parentEl=$('#parent'), exitBtn=$('#exitBtn'),
      exitTarget=$('#exitTarget'), starsEl=$('#stars');
let locked=false, parentOpen=false, round=0, stars=0, zTop=10, lastAct=Date.now();
let vw,vh,S,bx,by,tray, state=null, wakeLock=null;
let order=(function(){const car=ART.findIndex(a=>a.name==='Carrinho');return [car].concat(shuffle(ART.map((_,i)=>i).filter(i=>i!==car)));})();

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const rand=(a,b)=>a+Math.random()*(b-a);

/* ---------- Sons ---------- */
let actx=null;
function ac(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
  return actx;
}
function tone(f,t0,dur,type,vol){
  const a=ac(); if(!a)return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+t0;
  o.type=type||'triangle'; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.2,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const popSound=()=>{tone(520,0,.12);tone(780,.06,.16);};
const winSound=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.4,'triangle',.22));
function say(t){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.85;u.pitch=1.5;speechSynthesis.speak(u);}catch(e){}
}

function confetti(){
  const em=['⭐','❤️','🎈','✨','🌈','🌟','💛'];
  for(let i=0;i<36;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.textContent=em[i%em.length]; d.style.left=rand(0,96)+'vw'; d.style.fontSize=rand(22,44)+'px';
    d.style.animationDuration=rand(2.2,3.8)+'s'; d.style.animationDelay=rand(0,.8)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),5000);
  }
}

/* ---------- Layout ---------- */
function layout(){
  vw=innerWidth; vh=innerHeight;
  const m=16, top=64;
  if(vw>vh*1.15){ // paisagem: tabuleiro à esquerda, peças à direita
    S=Math.min(vh-top-m-12, vw*.5); bx=m+10; by=top+(vh-top-m-S)/2;
    const tx=bx+S+m*2; tray={x:tx,y:top,w:vw-tx-m,h:vh-top-m};
  }else{ // retrato: tabuleiro em cima, peças embaixo
    S=Math.min(vw-2*m, vh*.5); bx=(vw-S)/2; by=top;
    const ty=by+S+m; tray={x:m,y:ty,w:vw-2*m,h:vh-ty-m};
  }
}

/* ---------- Montagem do quebra-cabeça ---------- */
function place(p,cx,cy,s){
  p.cx=cx; p.cy=cy;
  p.el.style.left=(cx-p.pw/2)+'px'; p.el.style.top=(cy-p.ph/2)+'px'; p.el.style.transform='scale('+s+')';
}
function clearHints(){
  if(!state)return;
  state.pieces.forEach(p=>{p.el.classList.remove('hint');state.slots[p.idx].classList.remove('pulse');});
}

let clipN=0;

/* Gera os contornos das peças com encaixes (macho/fêmea) que combinam entre vizinhas */
function jigsaw(cols,rows){
  const cw=300/cols, ch=300/rows, T=Math.min(cw,ch)*.22;
  const rnd=()=>Math.random()<.5?1:-1;
  const h=[],v=[];
  for(let r=0;r<rows-1;r++){h[r]=[];for(let c=0;c<cols;c++)h[r][c]=rnd();}
  for(let r=0;r<rows;r++){v[r]=[];for(let c=0;c<cols-1;c++)v[r][c]=rnd();}
  const f=n=>Math.round(n*100)/100;
  function edge(ax,ay,bx,by,nx,ny,s){
    if(!s)return 'L'+f(bx)+' '+f(by);
    const L=Math.hypot(bx-ax,by-ay), ux=(bx-ax)/L, uy=(by-ay)/L, vx=nx*s, vy=ny*s;
    const A=(pu,q)=>f(ax+ux*pu+vx*q*T)+' '+f(ay+uy*pu+vy*q*T);
    const m=L/2, aw=.36*T, bw=.62*T;
    return 'L'+A(m-aw,0)+
      'C'+A(m-aw,.35)+' '+A(m-bw,.3)+' '+A(m-bw,.66)+
      'C'+A(m-bw*1.3,1.13)+' '+A(m+bw*1.3,1.13)+' '+A(m+bw,.66)+
      'C'+A(m+bw,.3)+' '+A(m+aw,.35)+' '+A(m+aw,0)+
      'L'+f(bx)+' '+f(by);
  }
  const paths=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x0=c*cw,y0=r*ch,x1=x0+cw,y1=y0+ch;
    const top=r?-h[r-1][c]:0, bottom=r<rows-1?h[r][c]:0, left=c?-v[r][c-1]:0, right=c<cols-1?v[r][c]:0;
    paths.push('M'+f(x0)+' '+f(y0)+edge(x0,y0,x1,y0,0,-1,top)+edge(x1,y0,x1,y1,1,0,right)+edge(x1,y1,x0,y1,0,1,bottom)+edge(x0,y1,x0,y0,-1,0,left)+'Z');
  }
  return {paths,cw,ch,T};
}

function build(){
  if(state&&state.timer)clearTimeout(state.timer);
  layout(); play.innerHTML='';
  if(round>0&&round%ART.length===0) order=shuffle(ART.map((_,i)=>i));
  const art=ART[order[round%order.length]];
  const cols=(round>=3&&round%2===1)?3:2, rows=2;
  const jg=jigsaw(cols,rows), k=S/300;
  const pw=S/cols, ph=S/rows, tp=jg.T*k, fw=pw+2*tp, fh=ph+2*tp;

  const board=document.createElement('div'); board.className='board';
  Object.assign(board.style,{left:bx+'px',top:by+'px',width:S+'px',height:S+'px'});
  board.innerHTML='<svg class="ghost" viewBox="0 0 300 300"><g class="gart">'+art.svg+'</g>'+
    jg.paths.map(d=>'<path class="slot" d="'+d+'"/>').join('')+'</svg>';
  play.appendChild(board);

  const st={art,board,pieces:[],slots:Array.from(board.querySelectorAll('.slot')),placed:0,total:cols*rows,busy:false,timer:null};
  state=st;
  const homes=shuffle([...Array(cols*rows).keys()]);
  const tcw=tray.w/cols, tch=tray.h/rows;
  const sc=Math.min(1,(tcw*.96)/fw,(tch*.96)/fh);

  for(let idx=0;idx<cols*rows;idx++){
    const r=Math.floor(idx/cols), c=idx%cols, d=jg.paths[idx], id='cp'+(++clipN);
    const el=document.createElement('div'); el.className='piece';
    el.style.width=fw+'px'; el.style.height=fh+'px';
    el.innerHTML='<svg viewBox="'+(c*jg.cw-jg.T)+' '+(r*jg.ch-jg.T)+' '+(jg.cw+2*jg.T)+' '+(jg.ch+2*jg.T)+'">'+
      '<defs><clipPath id="'+id+'"><path d="'+d+'"/></clipPath></defs>'+
      '<g clip-path="url(#'+id+')">'+art.svg+'</g><path class="outline" d="'+d+'"/></svg>';
    play.appendChild(el);

    const hc=homes[idx], tc=hc%cols, tr=Math.floor(hc/cols);
    const jx=Math.max(0,(tcw-fw*sc)/2)*.7, jy=Math.max(0,(tch-fh*sc)/2)*.7;
    const p={el,idx,pw:fw,ph:fh,cellw:pw,cellh:ph,sc,placed:false,drag:false,cx:0,cy:0,
      tx:bx+(c+.5)*pw, ty:by+(r+.5)*ph,
      home:{x:tray.x+(tc+.5)*tcw+rand(-jx,jx), y:tray.y+(tr+.5)*tch+rand(-jy,jy)}};
    st.pieces.push(p);
    place(p,p.home.x,p.home.y,sc);
    wirePiece(p);
  }
  lastAct=Date.now();
}

function wirePiece(p){
  const el=p.el;
  el.addEventListener('pointerdown',e=>{
    if(p.placed||state.busy)return;
    e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(_){}
    p.drag=true; lastAct=Date.now(); clearHints(); ac();
    el.classList.add('drag'); el.style.zIndex=++zTop;
    place(p,e.clientX,e.clientY,1.05);
  });
  el.addEventListener('pointermove',e=>{ if(p.drag) place(p,e.clientX,e.clientY,1.05); });
  const end=()=>{
    if(!p.drag)return;
    p.drag=false; el.classList.remove('drag'); lastAct=Date.now();
    if(Math.hypot(p.cx-p.tx,p.cy-p.ty)<Math.max(p.cellw,p.cellh)*.6){
      place(p,p.tx,p.ty,1); el.classList.add('placed'); el.style.zIndex=5;
      p.placed=true; state.placed++; popSound();
      if(state.placed===state.total) win();
    }else{
      place(p,p.home.x,p.home.y,p.sc);
    }
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}

function win(){
  const st=state; st.busy=true;
  setTimeout(()=>{
    st.board.classList.add('done','bounce');
    st.pieces.forEach(p=>p.el.classList.add('done'));
    winSound(); confetti(); say(st.art.say);
    stars++; starsEl.textContent='⭐ '+stars;
  },350);
  st.timer=setTimeout(()=>{round++; build();},4300);
}

/* dica se a criança ficar parada */
setInterval(()=>{
  if(!locked||parentOpen||!state||state.busy)return;
  if(Date.now()-lastAct>9000){
    const left=state.pieces.filter(p=>!p.placed&&!p.drag);
    if(left.length){
      const p=left[Math.floor(Math.random()*left.length)];
      p.el.classList.add('hint'); state.slots[p.idx].classList.add('pulse');
    }
    lastAct=Date.now()-5000;
  }
},2500);

/* ---------- Tela cheia / trava ---------- */
async function wake(){
  try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(locked&&document.visibilityState==='visible')wake(); });

function enterLock(){
  locked=true; parentOpen=false;
  startEl.classList.add('hidden'); parentEl.classList.add('hidden');
  ac();
  const d=document.documentElement, rf=d.requestFullscreen||d.webkitRequestFullscreen;
  if(rf){ try{ const r=rf.call(d); if(r&&r.catch)r.catch(()=>{}); }catch(e){} }
  wake();
  if(!state) build();
}
document.addEventListener('fullscreenchange',()=>{
  if(locked&&!parentOpen&&!document.fullscreenElement){
    $('#startMsg').textContent='Toque para continuar';
    startEl.classList.remove('hidden');
  }
});
$('#playBtn').addEventListener('click',enterLock);
$('#resumeBtn').addEventListener('click',enterLock);
$('#quitBtn').addEventListener('click',()=>{
  locked=false;
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  try{ if(wakeLock)wakeLock.release(); }catch(e){}
  $('#parentTitle').textContent='Trava desligada ✅';
  $('#parentMsg').textContent='Agora você pode fechar a aba ou sair do app normalmente.';
  $('#quitBtn').style.display='none';
});

/* impedir saída acidental */
history.pushState(null,'',location.href);
window.addEventListener('popstate',()=>{ if(locked) history.pushState(null,'',location.href); });
window.addEventListener('beforeunload',e=>{ if(locked){e.preventDefault();e.returnValue='';} });
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('selectstart',e=>e.preventDefault());

/* ---------- Saída dos pais: arrastar o ✕ até o canto ---------- */
(function(){
  let dragging=false,sx=0,sy=0,hold=null;
  const HOLD_MS=1000;
  const tgtCenter=()=>{const r=exitTarget.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};};
  exitBtn.addEventListener('pointerdown',e=>{
    e.preventDefault(); try{exitBtn.setPointerCapture(e.pointerId);}catch(_){}
    dragging=true; sx=e.clientX; sy=e.clientY;
    exitBtn.classList.add('drag'); exitTarget.classList.add('show');
  });
  exitBtn.addEventListener('pointermove',e=>{
    if(!dragging)return;
    exitBtn.style.transform='translate('+(e.clientX-sx)+'px,'+(e.clientY-sy)+'px)';
    const b=exitBtn.getBoundingClientRect(), t=tgtCenter();
    const inside=Math.hypot(b.left+b.width/2-t.x,b.top+b.height/2-t.y)<55;
    if(inside&&!hold){
      exitTarget.classList.add('hot');
      hold=setTimeout(()=>{ reset(); parentOpen=true; $('#parentTitle').textContent='Área dos pais 🔓';
        $('#parentMsg').textContent='Escolha o que fazer:'; $('#quitBtn').style.display='';
        parentEl.classList.remove('hidden'); },HOLD_MS);
    }else if(!inside&&hold){ clearTimeout(hold); hold=null; exitTarget.classList.remove('hot'); }
  });
  function reset(){
    dragging=false; clearTimeout(hold); hold=null;
    exitBtn.classList.remove('drag'); exitBtn.style.transform='';
    exitTarget.classList.remove('show','hot');
  }
  exitBtn.addEventListener('pointerup',reset);
  exitBtn.addEventListener('pointercancel',reset);
})();

/* ---------- Rotação / redimensionamento ---------- */
let rt=null;
addEventListener('resize',()=>{
  clearTimeout(rt);
  rt=setTimeout(()=>{ if(state&&!state.busy&&!state.pieces.some(p=>p.drag)) build(); },300);
});
})();
</script>
